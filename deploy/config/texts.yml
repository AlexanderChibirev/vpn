instructions_menu: |
  📱 <b>Как подключить</b>

  Выберите ваше устройство:

instr_ios: |
  🍎 <b>iPhone / iPad</b>

  1. Установите <b>{app}</b> (кнопка ниже).
     ⚠️ В российском App Store официального {app} сейчас нет — там только подделки. Варианты:
     • App Store с Apple ID другой страны — кнопка «{app}»;
     • если такого Apple ID нет — кнопка «{extra}» (сначала установится TestFlight от Apple).
  2. Вернитесь в бот и нажмите <b>«🔌 Подключить»</b> → «Добавить в {app}».
  3. В приложении нажмите кнопку включения и разрешите добавить конфигурацию VPN.

  Если приложение уже стоит — просто сделайте шаг 2.

instr_android: |
  🤖 <b>Android</b>

  1. Установите <b>{app}</b> из Google Play (кнопка ниже).
     Нет Google Play — кнопка «{extra}».
  2. Вернитесь в бот и нажмите <b>«🔌 Подключить»</b> → «Добавить в {app}».
  3. Нажмите кнопку включения и разрешите подключение.

  Альтернатива — {alt}.

instr_windows: |
  💻 <b>Windows</b>

  1. Скачайте и установите <b>{app}</b> (кнопка ниже).
  2. Нажмите <b>«🔌 Подключить»</b> → «Добавить в {app}».
     Не сработало? Скопируйте ссылку из «👤 Мой профиль», в приложении «+» → «Добавить из буфера».
  3. Нажмите кнопку подключения.

  Альтернатива — {alt}.

instr_macos: |
  🍏 <b>Mac</b>

  1. Скачайте <b>{app}</b> (кнопка ниже), откройте файл .dmg и перетащите приложение в «Программы».
  2. Нажмите <b>«🔌 Подключить»</b> → «Добавить в {app}».
     Не сработало? Скопируйте ссылку из «👤 Мой профиль», в приложении «+» → «Добавить из буфера».
  3. Включите подключение и разрешите добавить конфигурацию VPN.

  Альтернатива — {alt}.


# Тексты бота. Разметка — HTML Telegram: <b>жирный</b>, <i>курсив</i>, <code>моноширинный</code>.
# Слова в фигурных скобках ({date}, {hours} и т.п.) подставляет бот — их не удалять.
# После правки: в боте команда /reload.


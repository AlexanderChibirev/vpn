# /opt/vpn/docker-compose.yml — всё поднимается само после перезагрузки (restart: unless-stopped).
services:
  3xui:
    image: ghcr.io/mhsanaei/3x-ui:v3.8.5
    container_name: 3xui
    network_mode: host
    cap_add: [NET_ADMIN, NET_RAW]
    volumes:
      - ./xui/db/:/etc/x-ui/
      - ./xui/cert/:/root/cert/
      - ./xui/acme/:/root/.acme.sh/
    environment:
      XRAY_VMESS_AEAD_FORCED: "false"
      XUI_ENABLE_FAIL2BAN: "true"
      XUI_MEMORY_LIMIT: "350"
    tty: true
    restart: unless-stopped
    logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}

  web:
    image: nginx:1.29-alpine
    container_name: vpn-web
    network_mode: host          # слушает только 127.0.0.1:8443 — цель маскировки Reality
    volumes:
      - ./web/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./web/index.html:/usr/share/nginx/html/index.html:ro
      - ./xui/cert:/cert:ro
    restart: unless-stopped
    mem_limit: 64m
    logging: {driver: json-file, options: {max-size: "5m", max-file: "2"}}

  bot:
    build: ./bot
    image: vpn-bot:latest
    container_name: vpn-bot
    network_mode: host          # бот ходит в API 3x-ui на 127.0.0.1
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
      CONFIG_DIR: /config
      TZ: Europe/Moscow
    volumes:
      - ./bot-data:/data
      - ./config:/config:ro
    depends_on: [3xui]
    restart: unless-stopped
    mem_limit: 256m
    logging: {driver: json-file, options: {max-size: "10m", max-file: "5"}}

# Сайт-«прикрытие» для Reality: слушает только 127.0.0.1:8443, настоящий сертификат сервера, TLS 1.3 + HTTP/2.
# Xray пересылает сюда всех, кто зашёл на 443 без ключа, — снаружи это выглядит как обычный сайт.
worker_processes 1;
events { worker_connections 512; }
http {
  server_tokens off;
  access_log off;
  server {
    listen 127.0.0.1:8443 ssl;
    http2 on;
    server_name _;
    ssl_certificate     /cert/fullchain.pem;
    ssl_certificate_key /cert/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:1m;
    root /usr/share/nginx/html;
    location / { try_files $uri /index.html; }
  }
}
